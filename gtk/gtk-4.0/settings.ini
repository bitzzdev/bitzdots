[Settings]
# Explicit dark theme for barebone installs (no gsettings/portal required).
# libadwaita prefers the portal color-scheme and may log a benign warning
# about this flag, but it guarantees GTK4 apps are dark without a portal.
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Sans 10
