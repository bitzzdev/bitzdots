# Auto-generated by matugen — hyprlock theme

background {
    monitor =
    path = $HOME/.cache/current_wallpaper.png
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    rounding = 0
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    inner_color = rgb({{colors.surface.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    check_color = rgb({{colors.secondary.default.hex_stripped}})
    fail_color = rgb({{colors.error.default.hex_stripped}})
    capslock_color = rgb({{colors.tertiary.default.hex_stripped}})
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -180
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date '+%I:%M %p')"
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgb({{colors.on_surface.default.hex_stripped}})
    position = 0, 100
    halign = center
    valign = center
}

label {
    text = cmd[update:3600] echo "$(date '+%A, %d %B %Y')"
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    position = 0, 40
    halign = center
    valign = center
}
