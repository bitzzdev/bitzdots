[config]
caching = true
prefer = "saturation"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/style.css"

[templates.waybar_config]
input_path = "~/.config/matugen/templates/waybar-config.jsonc"
output_path = "~/.config/waybar/config.jsonc"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync.css"
output_path = "~/.config/swaync/style.css"

[templates.wlogout]
input_path = "~/.config/matugen/templates/wlogout.css"
output_path = "~/.config/wlogout/style.css"

[templates.hypr]
input_path = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"

[templates.cava]
input_path = "~/.config/matugen/templates/cava-colors"
output_path = "~/.config/cava/themes/generated"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
