[templates.icon_cancel]
input_path = "~/.config/matugen/templates/cancel.svg"
output_path = "~/.config/rofi/icons/cancel.svg"

[templates.icon_static]
input_path = "~/.config/matugen/templates/static.svg"
output_path = "~/.config/rofi/icons/static.svg"

[templates.icon_live]
